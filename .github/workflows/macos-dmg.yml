name: release

env:
  # vendor/ contains a design-skill submodule, not Go dependencies.
  GOFLAGS: -mod=mod

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.5.1"
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.24

      - name: Validate release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: wails3 task build VERSION="$VERSION"

      - name: Test
        run: go test ./...

      - name: Sign and notarize universal macOS update
        env:
          AKPROXY_CERTIFICATE_BASE64: ${{ secrets.AKPROXY_CERTIFICATE_BASE64 }}
          AKPROXY_CERTIFICATE_PASSWORD: ${{ secrets.AKPROXY_CERTIFICATE_PASSWORD }}
          AKPROXY_SIGNING_IDENTITY: ${{ secrets.AKPROXY_SIGNING_IDENTITY }}
          AKPROXY_APPLE_ID: ${{ secrets.AKPROXY_APPLE_ID }}
          AKPROXY_APPLE_TEAM_ID: ${{ secrets.AKPROXY_APPLE_TEAM_ID }}
          AKPROXY_APPLE_APP_PASSWORD: ${{ secrets.AKPROXY_APPLE_APP_PASSWORD }}
        run: bash scripts/release-macos.sh

      - name: Package DMG
        run: bash scripts/package-dmg.sh build/bin/akproxy.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: akproxy-dmg
          path: build/bin/akproxy.dmg
          if-no-files-found: error

      - name: Upload macOS update
        uses: actions/upload-artifact@v7.0.1
        with:
          name: akproxy-darwin-update
          path: build/bin/akproxy-darwin-universal.zip
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
          - runner: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.5.1"
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev pkg-config
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.24
      - name: Validate release version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: wails3 task build VERSION="$VERSION"
      - name: Test
        run: go test ./...
      - name: Package Windows update
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/akproxy.exe -DestinationPath build/bin/akproxy-windows-amd64.zip
      - name: Package Linux update
        if: runner.os == 'Linux'
        run: tar -C build/bin -czf build/bin/akproxy-linux-amd64.tar.gz akproxy
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: akproxy-${{ matrix.platform }}-update
          path: |
            build/bin/akproxy-*.zip
            build/bin/akproxy-*.tar.gz
          if-no-files-found: error

  draft:
    needs: [package, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: akproxy-*
          merge-multiple: true
          path: release
      - name: Create checksums and draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum akproxy.dmg akproxy-darwin-universal.zip akproxy-windows-amd64.zip akproxy-linux-amd64.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes \
            akproxy.dmg akproxy-darwin-universal.zip akproxy-windows-amd64.zip akproxy-linux-amd64.tar.gz SHA256SUMS
