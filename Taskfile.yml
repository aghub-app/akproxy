version: '3'

vars:
  BIN: 'build/bin/akproxy{{if eq OS "windows"}}.exe{{end}}'
  VERSION: '{{.VERSION | default "dev"}}'

tasks:
  bindings:
    cmds:
      - wails3 generate bindings -ts -i

  frontend:
    deps: [bindings]
    cmds:
      - pnpm --dir frontend install --frozen-lockfile
      - pnpm --dir frontend run build

  build:
    deps: [frontend]
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=12.0{{else}}{{.CGO_CFLAGS}}{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=12.0{{else}}{{.CGO_LDFLAGS}}{{end}}'
    cmds:
      - go build -tags '{{if eq .DEV "true"}}dev{{else}}production{{end}}' -ldflags '{{if ne .DEV "true"}}-s -w {{end}}-X main.version={{.VERSION}} {{if eq OS "windows"}}-H windowsgui{{end}}' -o '{{.BIN}}' .
      - cmd: bash scripts/package-app.sh '{{.VERSION}}'
        platforms: [darwin]

  package:
    deps: [build]
    cmds:
      - cmd: bash scripts/package-dmg.sh build/bin/akproxy.dmg
        platforms: [darwin]

  run:
    cmds:
      - '{{if eq OS "darwin"}}build/bin/akproxy.app/Contents/MacOS/akproxy{{else}}{{.BIN}}{{end}}'

  dev:
    cmds:
      - wails3 dev -config build/config.yml -port 9245
